<!DOCTYPE html>
<html lang="th" data-theme="light" data-fs="m" data-lh="cozy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Summary Reader · Disease of Reproductive System</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/noto-sans-thai/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.0/index.css">
<style>
/* ============ DESIGN SYSTEM ============ */
:root{
  --bg:#f4f7f6; --bg-2:#eef3f1; --surface:#ffffff; --surface-2:#f7faf9; --surface-3:#eef4f2;
  --text:#0e1c1a; --text-2:#3d524e; --muted:#6b817c; --faint:#93a5a1;
  --border:#e0e8e5; --border-2:#cddbd7;
  --primary:#0d9488; --primary-2:#0f766e; --primary-3:#14b8a6; --primary-soft:#e4f5f2; --primary-ring:rgba(13,148,136,.18);
  --accent:#b45309; --accent-soft:#fdf2e0; --accent-border:#f0d9ac;
  --danger:#b42318; --danger-soft:#fdeceb;
  --ok:#15803d; --ok-soft:#e8f6ec;
  --info:#1d4ed8; --info-soft:#eaf0fe;
  --radius:14px; --radius-sm:10px; --radius-lg:20px;
  --shadow-1:0 1px 2px rgba(14,40,36,.05);
  --shadow-2:0 2px 6px rgba(14,40,36,.06), 0 14px 34px -18px rgba(14,40,36,.28);
  --shadow-3:0 24px 60px -24px rgba(14,40,36,.34);
  --fs:1rem; --lh:1.75; --readw:820px;
  --header-h:62px; --side-w:308px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
  --bg:#0b1211; --bg-2:#0e1615; --surface:#121b1a; --surface-2:#16211f; --surface-3:#1b2826;
  --text:#e8f1ef; --text-2:#c2d3cf; --muted:#93a8a3; --faint:#6f857f;
  --border:#22302e; --border-2:#2e3f3c;
  --primary:#2dd4bf; --primary-2:#14b8a6; --primary-3:#5eead4; --primary-soft:#10312d; --primary-ring:rgba(45,212,191,.22);
  --accent:#fbbf24; --accent-soft:#2a2113; --accent-border:#4a3a17;
  --danger:#fca5a5; --danger-soft:#2c1614; --ok:#86efac; --ok-soft:#12291a;
  --info:#93c5fd; --info-soft:#14203a;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 6px rgba(0,0,0,.3), 0 16px 40px -20px rgba(0,0,0,.7);
  --shadow-3:0 24px 60px -24px rgba(0,0,0,.8);
}
html[data-theme="sepia"]{
  --bg:#f6f1e7; --bg-2:#efe8da; --surface:#fdfaf3; --surface-2:#f8f2e6; --surface-3:#f1e9d8;
  --text:#2c241a; --text-2:#4e4234; --muted:#7a6c58; --faint:#a2937c;
  --border:#e6dcc8; --border-2:#d6c9ae;
  --primary:#9a6b2f; --primary-2:#7d5522; --primary-3:#b98442; --primary-soft:#f6ead6; --primary-ring:rgba(154,107,47,.2);
  --accent:#9a3412; --accent-soft:#fbeadf; --accent-border:#e8cbb4;
}
html[data-fs="s"]{--fs:.9375rem} html[data-fs="m"]{--fs:1rem}
html[data-fs="l"]{--fs:1.075rem} html[data-fs="xl"]{--fs:1.1875rem}
html[data-lh="cozy"]{--lh:1.72} html[data-lh="relax"]{--lh:2}
html[data-w="narrow"]{--readw:680px} html[data-w="wide"]{--readw:1000px}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter Variable','Noto Sans Thai Variable','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:var(--fs);line-height:var(--lh);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--primary-2);text-decoration:none}
::selection{background:var(--primary-ring)}
.mono{font-family:var(--mono);font-variant-ligatures:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ SCROLLBAR ============ */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px;border:3px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--faint)}

/* ============ APP SHELL ============ */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary-3),var(--primary-2));color:#fff;box-shadow:var(--shadow-1)
}
.logo svg{width:19px;height:19px}
.brand-txt{min-width:0;line-height:1.15}
.brand-txt b{display:block;font-size:.94rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{display:block;font-size:.7rem;color:var(--muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topnav{display:flex;gap:4px;margin-left:8px}
.tnav{
  padding:7px 13px;border-radius:99px;font-size:.85rem;font-weight:600;color:var(--muted);
  transition:.18s;white-space:nowrap
}
.tnav:hover{background:var(--surface-3);color:var(--text)}
.tnav.on{background:var(--primary-soft);color:var(--primary-2)}
.topsearch{flex:1;max-width:420px;margin-left:auto;position:relative}
.topsearch input{
  width:100%;height:38px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface-2);padding:0 40px 0 36px;font-size:.88rem;outline:none;transition:.18s
}
.topsearch input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-ring)}
.topsearch .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.topsearch .kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.66rem;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:var(--surface)}
.topacts{display:flex;align-items:center;gap:6px}
.iconbtn{
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);
  border:1px solid transparent;transition:.18s;position:relative;flex:none
}
.iconbtn:hover{background:var(--surface-3);color:var(--text);border-color:var(--border)}
.iconbtn.on{background:var(--primary-soft);color:var(--primary-2);border-color:var(--primary-ring)}
.badge-dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--primary);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.prog-pill{
  display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--border);font-size:.76rem;font-weight:600;color:var(--text-2)
}
.ring{width:26px;height:26px;transform:rotate(-90deg);flex:none}
.ring circle{fill:none;stroke-width:3.2}
.ring .bgc{stroke:var(--border-2)}
.ring .fgc{stroke:var(--primary);stroke-linecap:round;transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}

/* ============ BODY LAYOUT ============ */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);flex:1;align-items:start}
.sidebar{
  position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  border-right:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden
}
.side-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.side-head .lbl{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.side-head h3{margin:4px 0 0;font-size:.95rem;font-weight:700;letter-spacing:-.01em}
.side-filter{padding:10px 12px;border-bottom:1px solid var(--border)}
.side-filter input{
  width:100%;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  padding:0 10px;font-size:.82rem;outline:none
}
.side-filter input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.side-list{overflow-y:auto;flex:1;padding:8px 8px 28px;overscroll-behavior:contain}
.side-meta{padding:9px 12px;font-size:.72rem;color:var(--muted);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;background:var(--surface-2)}
.snav{
  width:100%;display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:10px;
  text-align:left;transition:.15s;position:relative;margin-bottom:2px
}
.snav:hover{background:var(--surface-3)}
.snav.on{background:var(--primary-soft)}
.snav.on .snav-t{color:var(--primary-2);font-weight:700}
.snav-n{
  font-family:var(--mono);font-size:.66rem;font-weight:700;color:var(--faint);
  min-width:20px;padding-top:2px;letter-spacing:-.02em
}
.snav.on .snav-n{color:var(--primary)}
.snav-b{min-width:0;flex:1}
.snav-t{font-size:.83rem;font-weight:600;line-height:1.4;color:var(--text);display:block;word-break:break-word}
.snav-s{font-size:.68rem;color:var(--muted);font-family:var(--mono);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.snav-mark{width:7px;height:7px;border-radius:99px;background:var(--primary);flex:none;margin-top:6px;opacity:0;transition:.2s}
.snav.read .snav-mark{opacity:1}
.snav.bm::after{content:'★';position:absolute;right:8px;top:7px;font-size:.68rem;color:var(--accent)}
.side-empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:.82rem}

/* ============ MAIN ============ */
.main{min-width:0;padding:0 0 90px}
.wrap{max-width:1140px;margin:0 auto;padding:26px 26px 0}
.wrap.read{max-width:calc(var(--readw) + 120px)}

/* ============ VIEW HEADERS ============ */
.vhead{margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-weight:700}
.vhead h1{margin:8px 0 6px;font-size:clamp(1.5rem,3.4vw,2.1rem);font-weight:800;letter-spacing:-.025em;line-height:1.25}
.vhead p{margin:0;color:var(--muted);font-size:.93rem;max-width:70ch}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-1)}
.card.pad{padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ============ HERO ============ */
.hero{
  position:relative;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--border);
  background:
    radial-gradient(1100px 400px at 88% -30%,var(--primary-ring),transparent 60%),
    linear-gradient(160deg,var(--surface),var(--surface-2));
  padding:24px;box-shadow:var(--shadow-2);margin-bottom:22px
}
.hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(600px 220px at 100% 0%,#000,transparent 70%);
  -webkit-mask-image:radial-gradient(600px 220px at 100% 0%,#000,transparent 70%)
}
.hero-in{position:relative;z-index:1;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.hero-main{flex:1;min-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);color:var(--muted)
}
.chip.src{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary-2)}
.chip.acc{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.hero h2{margin:0 0 6px;font-size:clamp(1.35rem,3vw,1.85rem);font-weight:800;letter-spacing:-.025em;line-height:1.25}
.hero .sub{color:var(--text-2);font-size:.92rem;margin:0 0 16px;max-width:64ch}
.hero-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.hstat b{display:block;font-size:1.35rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hstat span{font-size:.72rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:132px}
.big-ring{width:112px;height:112px;transform:rotate(-90deg)}
.big-ring circle{fill:none;stroke-width:9}
.big-ring .bgc{stroke:var(--border)}
.big-ring .fgc{stroke:var(--primary);stroke-linecap:round;transition:stroke-dasharray .8s cubic-bezier(.4,0,.2,1)}
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap .val{position:absolute;text-align:center}
.ring-wrap .val b{font-size:1.5rem;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.ring-wrap .val span{font-size:.62rem;font-family:var(--mono);color:var(--muted);letter-spacing:.08em}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:.86rem;font-weight:650;
  border:1px solid var(--border);background:var(--surface);color:var(--text);transition:.16s;white-space:nowrap
}
.btn:hover{border-color:var(--border-2);background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--shadow-1)}
.btn:active{transform:translateY(0)}
.btn.pri{background:linear-gradient(160deg,var(--primary-3),var(--primary-2));border-color:transparent;color:#fff;box-shadow:0 6px 18px -8px var(--primary-ring)}
.btn.pri:hover{filter:brightness(1.06);box-shadow:0 10px 24px -10px var(--primary-ring)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn.xs{padding:4px 9px;font-size:.72rem;border-radius:7px}
.btn.dang{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--border))}
.btn:disabled{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* ============ SECTION LISTS ============ */
.seclist{display:grid;gap:8px}
.secitem{
  display:flex;gap:12px;align-items:center;padding:11px 13px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);transition:.16s;width:100%;text-align:left
}
.secitem:hover{border-color:var(--primary);transform:translateX(2px);box-shadow:var(--shadow-1)}
.secitem .num{
  font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--primary);
  background:var(--primary-soft);border-radius:7px;padding:4px 7px;flex:none
}
.secitem .t{flex:1;min-width:0}
.secitem .t b{display:block;font-size:.88rem;font-weight:650;line-height:1.35}
.secitem .t span{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
.secitem .st{display:flex;gap:6px;align-items:center;flex:none}
.tick{width:18px;height:18px;border-radius:99px;border:1.5px solid var(--border-2);display:grid;place-items:center;color:transparent;font-size:.62rem;flex:none}
.tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.bm-btn{color:var(--faint);font-size:.9rem;transition:.15s;padding:2px}
.bm-btn:hover{color:var(--accent);transform:scale(1.15)}
.bm-btn.on{color:var(--accent)}

/* ============ TAG / META ============ */
.tag{font-size:.68rem;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.04em}
.tag.male{background:var(--info-soft);color:var(--info)}
.tag.female{background:#fdeef4;color:#be185d}
html[data-theme="dark"] .tag.female{background:#331524;color:#f9a8d4}
.tag.std{background:var(--accent-soft);color:var(--accent)}
.tag.path{background:var(--primary-soft);color:var(--primary-2)}

/* ============ READER ============ */
.reader-top{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0 16px;
  border-bottom:1px solid var(--border);margin-bottom:22px
}
.crumb{font-size:.76rem;color:var(--muted);font-family:var(--mono);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumb b{color:var(--primary-2)}
.article{max-width:var(--readw)}
.art-head{margin-bottom:20px}
.art-num{
  font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.18em;color:var(--primary);
  text-transform:uppercase;display:flex;align-items:center;gap:9px
}
.art-num::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,var(--primary-ring),transparent)}
.art-head h1{margin:10px 0 4px;font-size:clamp(1.5rem,3.6vw,2.15rem);font-weight:800;letter-spacing:-.03em;line-height:1.22}
.art-head .th-sub{margin:0 0 12px;color:var(--text-2);font-size:1rem;font-weight:600}
.art-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta-pill{
  display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-family:var(--mono);
  padding:4px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)
}
.meta-pill.val{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:700}

.block{margin:0 0 22px}
.blk-label{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.66rem;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin-bottom:9px
}
.blk-label::after{content:'';flex:1;height:1px;background:var(--border)}

.summary-card{
  position:relative;border-radius:var(--radius);padding:18px 20px 18px 22px;
  background:linear-gradient(150deg,var(--primary-soft),var(--surface) 70%);
  border:1px solid var(--border);box-shadow:var(--shadow-1)
}
.summary-card::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:99px;background:linear-gradient(var(--primary-3),var(--primary-2))}
.summary-card p{margin:0;font-size:1.02em;color:var(--text)}
.summary-card .gen{
  display:flex;gap:7px;align-items:center;margin-top:12px;padding-top:11px;border-top:1px dashed var(--border-2);
  font-size:.72rem;color:var(--muted);font-family:var(--mono);flex-wrap:wrap
}

h3.blk-h{font-size:1.14em;font-weight:750;letter-spacing:-.015em;margin:26px 0 9px;display:flex;align-items:center;gap:9px}
h3.blk-h::before{content:'';width:5px;height:1.05em;border-radius:99px;background:var(--primary);flex:none}
h4.blk-h2{font-size:1em;font-weight:700;margin:19px 0 7px;color:var(--primary-2)}
.reader-body p{margin:0 0 12px;color:var(--text-2)}
.reader-body strong{color:var(--text);font-weight:700}
.reader-body em{color:var(--text);font-style:normal;background:linear-gradient(transparent 62%,var(--primary-ring) 62%);padding:0 2px;border-radius:2px}
ul.blk-ul,ol.blk-ol{margin:0 0 14px;padding-left:0;list-style:none}
ul.blk-ul li,ol.blk-ol li{position:relative;padding:3px 0 3px 24px;color:var(--text-2)}
ul.blk-ul li::before{content:'';position:absolute;left:7px;top:.86em;width:6px;height:6px;border-radius:2px;background:var(--primary);opacity:.75}
ol.blk-ol{counter-reset:oi}
ol.blk-ol li{counter-increment:oi}
ol.blk-ol li::before{
  content:counter(oi);position:absolute;left:0;top:.42em;width:17px;height:17px;border-radius:5px;
  background:var(--surface-3);border:1px solid var(--border);font-family:var(--mono);font-size:.64rem;font-weight:700;
  display:grid;place-items:center;color:var(--text-2)
}
.defbox{
  display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:12px;padding:11px 14px;margin-bottom:9px;
  background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:9px
}
.defbox b{font-size:.9em;font-weight:700;color:var(--text)}
.defbox span{font-size:.92em;color:var(--text-2)}
.callout{
  padding:13px 15px;border-radius:11px;margin:0 0 14px;font-size:.93em;
  background:var(--accent-soft);border:1px solid var(--accent-border);color:var(--text-2);
  display:flex;gap:11px;align-items:flex-start
}
.callout .ci{flex:none;width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.72rem;font-weight:800;margin-top:1px}
.callout.info{background:var(--info-soft);border-color:transparent}
.callout.info .ci{background:var(--info)}
.callout.warn{background:var(--danger-soft);border-color:transparent}
.callout.warn .ci{background:var(--danger)}
.callout b{color:var(--text)}

/* ============ TABLE ============ */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;margin-bottom:14px;background:var(--surface)}
table.tbl{width:100%;border-collapse:collapse;font-size:.885em;min-width:420px}
table.tbl th{
  background:var(--surface-3);text-align:left;padding:10px 13px;font-weight:700;font-size:.82em;
  letter-spacing:.02em;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap
}
table.tbl td{padding:10px 13px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td b{color:var(--text)}

/* ============ KEY POINTS ============ */
.kp{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.kp li{
  display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);transition:.16s;cursor:pointer;font-size:.93em
}
.kp li:hover{border-color:var(--primary);background:var(--primary-soft)}
.kp li.checked{opacity:.6}
.kp li.checked .kp-t{text-decoration:line-through}
.kp .box{
  width:19px;height:19px;border-radius:6px;border:1.8px solid var(--border-2);flex:none;margin-top:2px;
  display:grid;place-items:center;color:#fff;font-size:.66rem;transition:.16s;background:var(--surface)
}
.kp li.checked .box{background:var(--primary);border-color:var(--primary)}
.kp-t{color:var(--text-2);line-height:1.6}

/* ============ TERMS ============ */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:9px}
.term{
  padding:11px 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);transition:.16s
}
.term:hover{border-color:var(--primary);transform:translateY(-1px);box-shadow:var(--shadow-1)}
.term b{display:block;font-size:.85em;font-weight:700;color:var(--primary-2);margin-bottom:3px;font-family:var(--mono);letter-spacing:-.01em}
.term span{font-size:.855em;color:var(--text-2);line-height:1.55;display:block}

/* ============ STATIC PROCESS ============ */
.proc{display:flex;flex-direction:column;gap:0;margin-bottom:14px}
.proc-step{display:flex;gap:12px;align-items:flex-start}
.proc-rail{display:flex;flex-direction:column;align-items:center;flex:none}
.proc-dot{
  width:26px;height:26px;border-radius:99px;background:var(--surface);border:2px solid var(--primary);
  display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;font-weight:800;color:var(--primary-2);flex:none
}
.proc-line{width:2px;flex:1;min-height:16px;background:linear-gradient(var(--primary-ring),var(--border))}
.proc-body{padding:2px 0 15px;min-width:0}
.proc-body b{display:block;font-size:.9em;font-weight:700;color:var(--text)}
.proc-body span{font-size:.855em;color:var(--muted);display:block;line-height:1.55}

/* ============ INTERACTIVE MODEL ============ */
.model{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:hidden;
  box-shadow:var(--shadow-2);margin-bottom:16px
}
.model-head{
  display:flex;gap:10px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--border);
  background:linear-gradient(var(--surface-2),var(--surface));flex-wrap:wrap
}
.mbadge{
  font-family:var(--mono);font-size:.62rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--primary);color:#fff;flex:none
}
.model-head h4{margin:0;font-size:.94rem;font-weight:700;flex:1;min-width:140px}
.model-head .msrc{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.model-stage{padding:16px 15px;background:
  radial-gradient(600px 200px at 50% 0%,var(--primary-soft),transparent 70%)}
.mflow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.mnode{
  flex:1 1 120px;min-width:105px;padding:10px 11px;border-radius:11px;background:var(--surface);
  border:1.5px solid var(--border);transition:.24s;position:relative;text-align:left;opacity:.55
}
.mnode:hover{opacity:.9;border-color:var(--border-2)}
.mnode .mi{font-family:var(--mono);font-size:.6rem;font-weight:800;color:var(--faint);letter-spacing:.1em}
.mnode b{display:block;font-size:.82rem;font-weight:700;margin-top:3px;line-height:1.35;color:var(--text)}
.mnode .mtag{display:inline-block;margin-top:6px;font-family:var(--mono);font-size:.58rem;padding:2px 6px;border-radius:5px;background:var(--surface-3);color:var(--muted);letter-spacing:.05em}
.mnode.act{opacity:1;border-color:var(--primary);background:var(--primary-soft);box-shadow:0 6px 20px -10px var(--primary-ring);transform:translateY(-2px)}
.mnode.act .mi{color:var(--primary)}
.mnode.done{opacity:.85;border-color:var(--primary-ring)}
.mnode.done::after{content:'✓';position:absolute;top:8px;right:9px;font-size:.66rem;color:var(--primary);font-weight:800}
.mdetail{
  margin-top:14px;padding:14px 15px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid var(--primary);min-height:76px
}
.mdetail .md-h{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);font-weight:800;margin-bottom:5px}
.mdetail b{font-size:.95rem;display:block;margin-bottom:4px}
.mdetail p{margin:0;font-size:.9rem;color:var(--text-2);line-height:1.65}
.mctrl{display:flex;gap:7px;align-items:center;padding:11px 15px;border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.mctrl .mbtn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:.79rem;font-weight:650;
  border:1px solid var(--border);background:var(--surface);transition:.15s;color:var(--text-2)
}
.mctrl .mbtn:hover{border-color:var(--primary);color:var(--primary-2);background:var(--primary-soft)}
.mctrl .mbtn.play{background:var(--primary);border-color:transparent;color:#fff}
.mctrl .mbtn.play:hover{filter:brightness(1.08);color:#fff}
.mtrack{flex:1;min-width:90px;height:5px;border-radius:99px;background:var(--border);overflow:hidden}
.mtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-3),var(--primary-2));border-radius:99px;transition:width .3s}
.mcount{font-family:var(--mono);font-size:.7rem;color:var(--muted);font-weight:700}
.model-fallback{padding:14px 15px;background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:10px;font-size:.85rem;color:var(--text-2)}

/* ============ SOURCE REF ============ */
.srcref{
  display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  padding:13px 16px;border-radius:var(--radius);background:var(--surface-2);border:1px dashed var(--border-2);margin-top:6px
}
.srcref .sl{font-family:var(--mono);font-size:.78rem;color:var(--text-2)}
.srcref .sl b{color:var(--primary-2);font-size:.9rem}
.visual-note{
  font-size:.76rem;color:var(--faint);font-family:var(--mono);padding:8px 12px;border-radius:8px;
  background:var(--surface-2);border:1px solid var(--border);margin-bottom:14px;display:inline-flex;gap:7px;align-items:center
}

/* ============ ART FOOTER NAV ============ */
.artnav{display:flex;gap:11px;margin-top:26px;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap}
.artnav button{
  flex:1;min-width:200px;text-align:left;padding:13px 15px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface);transition:.17s
}
.artnav button:hover:not(:disabled){border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-2)}
.artnav button:disabled{opacity:.4;cursor:not-allowed}
.artnav .k{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:4px}
.artnav .v{font-size:.88rem;font-weight:650;color:var(--text);display:block;line-height:1.4}
.artnav button.next{text-align:right}

/* ============ SLIDE BAR ============ */
.slidebar{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding:9px 14px;display:flex;gap:12px;align-items:center
}
.slidebar .sl-info{display:flex;flex-direction:column;min-width:118px}
.slidebar .sl-info b{font-family:var(--mono);font-size:.82rem;font-weight:800;letter-spacing:-.02em}
.slidebar .sl-info span{font-size:.68rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.sl-track{flex:1;min-width:60px;position:relative;height:26px;display:flex;align-items:center}
.sl-track input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:26px;margin:0}
.sl-track input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--border)}
.sl-track input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--border)}
.sl-track input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:99px;background:var(--primary);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--primary-ring);margin-top:-5.5px;cursor:grab}
.sl-track input[type=range]::-moz-range-thumb{width:17px;height:17px;border-radius:99px;background:var(--primary);border:3px solid var(--surface);cursor:grab}
.sl-jump{position:relative}
.sl-jump select{
  height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);padding:0 9px;
  font-size:.78rem;font-family:var(--mono);max-width:210px;outline:none;cursor:pointer
}

/* ============ DRAWER (SOURCE VIEWER) ============ */
.scrim{position:fixed;inset:0;background:rgba(6,20,18,.42);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);z-index:90;background:var(--surface);
  border-left:1px solid var(--border);box-shadow:var(--shadow-3);transform:translateX(102%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column
}
.drawer.on{transform:none}
.drawer-head{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;gap:11px;align-items:flex-start;background:var(--surface-2)}
.drawer-head .dh-t{flex:1;min-width:0}
.drawer-head h3{margin:0 0 3px;font-size:.98rem;font-weight:750}
.drawer-head p{margin:0;font-size:.74rem;color:var(--muted);font-family:var(--mono)}
.drawer-body{overflow-y:auto;padding:16px 18px 30px;flex:1}
.src-slide{border:1px solid var(--border);border-radius:11px;margin-bottom:11px;overflow:hidden;background:var(--surface)}
.src-slide-h{
  display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--surface-3);
  font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--text-2);border-bottom:1px solid var(--border)
}
.src-slide-h .dot{width:7px;height:7px;border-radius:99px;background:var(--primary)}
.src-slide-b{padding:11px 13px;font-family:var(--mono);font-size:.76rem;line-height:1.75;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.src-note{padding:11px 13px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent-border);font-size:.8rem;color:var(--text-2);margin-bottom:13px;display:flex;gap:9px}

/* ============ MODAL / SEARCH OVERLAY ============ */
.modal{
  position:fixed;inset:0;z-index:95;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px
}
.modal.on{display:flex}
.modal-in{
  width:min(760px,100%);max-height:78vh;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-3);overflow:hidden;display:flex;flex-direction:column;animation:pop .22s cubic-bezier(.2,.9,.3,1)
}
@keyframes pop{from{opacity:0;transform:translateY(-12px) scale(.985)}to{opacity:1;transform:none}}
.modal-search{display:flex;gap:11px;align-items:center;padding:15px 17px;border-bottom:1px solid var(--border)}
.modal-search input{flex:1;border:none;outline:none;background:transparent;font-size:1.02rem}
.modal-res{overflow-y:auto;padding:9px}
.res-group{padding:7px 10px 3px;font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);font-weight:800}
.res{
  width:100%;text-align:left;padding:11px 13px;border-radius:11px;transition:.14s;display:block;border:1px solid transparent
}
.res:hover,.res.sel{background:var(--primary-soft);border-color:var(--primary-ring)}
.res .rt{font-size:.88rem;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res .rt .rp{font-family:var(--mono);font-size:.66rem;color:var(--primary);font-weight:700}
.res .rc{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res mark{background:color-mix(in srgb,var(--accent) 26%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty .ei{width:52px;height:52px;border-radius:15px;background:var(--surface-3);display:grid;place-items:center;margin:0 auto 13px;color:var(--faint)}
.empty b{display:block;font-size:.98rem;color:var(--text);margin-bottom:5px}
.empty p{margin:0;font-size:.85rem;max-width:44ch;margin-inline:auto}

/* ============ SETTINGS POPOVER ============ */
.pop{
  position:absolute;top:calc(var(--header-h) - 6px);right:14px;width:290px;z-index:70;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-3);
  padding:15px;display:none;animation:pop .18s ease
}
.pop.on{display:block}
.pop h4{margin:0 0 11px;font-size:.76rem;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.pop-row{margin-bottom:15px}
.pop-row .pl{font-size:.78rem;font-weight:650;color:var(--text-2);margin-bottom:7px;display:block}
.seg{display:flex;gap:4px;background:var(--surface-3);padding:3px;border-radius:9px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:.76rem;font-weight:650;color:var(--muted);transition:.15s}
.seg button.on{background:var(--surface);color:var(--primary-2);box-shadow:var(--shadow-1)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0}
.switch span{font-size:.82rem;color:var(--text-2)}
.tgl{width:40px;height:23px;border-radius:99px;background:var(--border-2);position:relative;transition:.2s;flex:none}
.tgl::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:99px;background:#fff;transition:.2s;box-shadow:var(--shadow-1)}
.tgl.on{background:var(--primary)}
.tgl.on::after{transform:translateX(17px)}

/* ============ LIBRARY ============ */
.libcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;
  box-shadow:var(--shadow-2);transition:.2s;display:flex;flex-direction:column
}
.libcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-3);border-color:var(--primary-ring)}
.libcover{
  height:132px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--primary-2),var(--primary-3) 55%,#67e8f9);
  display:flex;align-items:flex-end;padding:15px
}
.libcover::before{
  content:'';position:absolute;inset:0;opacity:.28;
  background-image:radial-gradient(circle at 20% 30%,#fff 1.4px,transparent 1.5px),radial-gradient(circle at 70% 65%,#fff 1.4px,transparent 1.5px);
  background-size:26px 26px,34px 34px
}
.libcover .fc{position:relative;z-index:1;color:#fff}
.libcover .fc .ftype{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;font-weight:800;opacity:.85;text-transform:uppercase}
.libcover .fc b{display:block;font-size:1.02rem;font-weight:750;line-height:1.3;margin-top:3px;text-shadow:0 1px 8px rgba(0,0,0,.22)}
.libbody{padding:16px 17px 17px;flex:1;display:flex;flex-direction:column;gap:13px}
.libmeta{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.libmeta div{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px}
.libmeta b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.02em}
.libmeta span{font-size:.66rem;font-family:var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.libprog .bar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;margin-top:6px}
.libprog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-3),var(--primary-2));border-radius:99px;transition:width .6s}
.libprog .lab{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);font-family:var(--mono)}

/* ============ REVIEW ============ */
.tabs{display:flex;gap:5px;flex-wrap:wrap;padding:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:18px}
.tabs button{padding:8px 14px;border-radius:8px;font-size:.83rem;font-weight:650;color:var(--muted);transition:.16s}
.tabs button:hover{color:var(--text);background:var(--surface)}
.tabs button.on{background:var(--surface);color:var(--primary-2);box-shadow:var(--shadow-1)}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
.numcard{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--primary);transition:.17s}
.numcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
.numcard b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.04em;color:var(--primary-2);line-height:1.1;font-family:var(--mono)}
.numcard span{display:block;font-size:.83rem;color:var(--text-2);margin-top:6px;line-height:1.55}

/* ============ TOAST ============ */
.toast-wrap{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:10px 17px;border-radius:99px;background:var(--text);color:var(--bg);font-size:.82rem;font-weight:600;
  box-shadow:var(--shadow-3);animation:tin .25s cubic-bezier(.2,.9,.3,1);display:flex;gap:8px;align-items:center
}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}

/* ============ REVEAL ============ */
.rv{opacity:0;transform:translateY(12px)}
.rv.in{opacity:1;transform:none;transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.3,1)}

/* ============ SKELETON ============ */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* ============ FOCUS MODE ============ */
html.focus .sidebar{display:none}
html.focus .shell{grid-template-columns:minmax(0,1fr)}
html.focus .topnav{display:none}

/* ============ RESPONSIVE ============ */
.mobnav{display:none}
.side-toggle{display:none}
@media(max-width:1080px){
  :root{--side-w:280px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topnav{display:none}
  .side-toggle{display:grid}
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;width:min(320px,86vw);z-index:70;
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-3);height:auto
  }
  .sidebar.on{transform:none}
  .wrap{padding:20px 18px 0}
  .mobnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:58;background:var(--surface);
    border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around
  }
  .mobnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 10px;border-radius:9px;color:var(--muted);font-size:.62rem;font-weight:650;transition:.15s}
  .mobnav button.on{color:var(--primary-2);background:var(--primary-soft)}
  .slidebar{bottom:56px;padding:7px 12px}
  .main{padding-bottom:150px}
  .topsearch{max-width:none}
  .topsearch .kbd{display:none}
}
@media(max-width:720px){

{
 id:"s25", n:"25", title:"Endometriosis", th:"เยื่อบุโพรงมดลูกเจริญผิดที่ และ Ovarian Endometrioma (Chocolate cyst)",

function ringSVG(pct,cls){
  const C=2*Math.PI*15.5;
  return '<svg class="'+(cls||"ring")+'" viewBox="0 0 36 36"><circle class="bgc" cx="18" cy="18" r="15.5"/><circle class="fgc" cx="18" cy="18" r="15.5" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/></svg>';

}

function renderBlock(b){
  switch(b.t){
   case "h": return h("h3","blk-h",b.x);
   case "h2": return h("h4","blk-h2",b.x);
   case "p": return h("p","",b.x);
   case "ul":{const u=h("ul","blk-ul");b.x.forEach(i=>u.appendChild(h("li","",i)));return u;}
   case "ol":{const o=h("ol","blk-ol");b.x.forEach(i=>o.appendChild(h("li","",i)));return o;}
   case "def":{const d=h("div","defbox");d.appendChild(h("b","",b.term));d.appendChild(h("span","",b.x));return d;}
   case "imp":{const c=h("div","callout");c.innerHTML='<span class="ci">!</span><div>'+b.x+'</div>';return c;}
   case "callout":{const c=h("div","callout "+(b.type||"info"));c.innerHTML='<span class="ci">'+(b.type==="warn"?"!":"i")+'</span><div>'+b.x+'</div>';return c;}
   case "tbl":{
     const w=h("div","tbl-wrap");const t=document.createElement("table");t.className="tbl";
     const th=document.createElement("thead");const tr=document.createElement("tr");
     b.head.forEach(x=>tr.appendChild(h("th","",x)));th.appendChild(tr);t.appendChild(th);
     const tb=document.createElement("tbody");
     b.rows.forEach(r=>{const rt=document.createElement("tr");r.forEach((c,i)=>rt.appendChild(h("td","",i===0?"<b>"+c+"</b>":c)));tb.appendChild(rt);});
     t.appendChild(tb);w.appendChild(t);return w;}
   case "proc":{
     const p=h("div","proc");
     b.steps.forEach((s,i)=>{
       const st=h("div","proc-step");
       const rail=h("div","proc-rail");rail.appendChild(h("div","proc-dot",String(i+1)));
       if(i<b.steps.length-1)rail.appendChild(h("div","proc-line"));
       st.appendChild(rail);
       const bd=h("div","proc-body");bd.appendChild(h("b","",s.t));bd.appendChild(h("span","",s.d||""));st.appendChild(bd);
       p.appendChild(st);
     });
     return p;}
   default: return h("p","",esc(b.x||""));
  }
}

/* interactive model with hard error isolation */
function buildModel(sec){
  const host=h("div");
  const m=sec.model;
  if(!m)return null;
  try{
    if(!m.steps||!m.steps.length)throw new Error("no model data");
    const box=h("div","model");
    box.innerHTML='<div class="model-head"><span class="mbadge">Interactive Model</span><h4>'+esc(m.title)+'</h4><span class="msrc">อ้างอิง '+esc(m.src)+'</span></div>'+
      '<div class="model-stage"><div class="mflow"></div><div class="mdetail"><div class="md-h">รายละเอียด</div><b></b><p></p></div></div>'+
      '<div class="mctrl">'+
        '<button class="mbtn" data-a="prev">◀ ก่อนหน้า</button>'+
        '<button class="mbtn play" data-a="play">▶ เล่นอัตโนมัติ</button>'+
        '<button class="mbtn" data-a="next">ถัดไป ▶</button>'+
        '<button class="mbtn" data-a="reset">↺ เริ่มใหม่</button>'+
        '<span class="mtrack"><i style="width:0%"></i></span><span class="mcount">0/'+m.steps.length+'</span>'+
      '</div>';
    const flow=box.querySelector(".mflow");
    m.steps.forEach((s,i)=>{
      const n=h("button","mnode");n.type="button";n.dataset.i=i;
      n.innerHTML='<span class="mi">STEP '+String(i+1).padStart(2,"0")+'</span><b>'+esc(s.l)+'</b>'+(s.tag?'<span class="mtag">'+esc(s.tag)+'</span>':"");
      n.onclick=()=>{setStep(i);stop();};
      flow.appendChild(n);
    });
    const nodes=[].slice.call(box.querySelectorAll(".mnode"));
    const dH=box.querySelector(".mdetail b"), dP=box.querySelector(".mdetail p");
    const cnt=box.querySelector(".mcount"), fill=box.querySelector(".mtrack i");
    const btnPlay=box.querySelector('[data-a="play"]');
    let cur=-1,timer=null;
    function setStep(i){
      if(i<0||i>=m.steps.length)return;
      cur=i;const s=m.steps[i];
      nodes.forEach((n,k)=>{n.classList.toggle("act",k===i);n.classList.toggle("done",k<i);});
      dH.textContent="ขั้นที่ "+(i+1)+" / "+m.steps.length+(s.tag?" · "+s.tag:"");
      dP.textContent=s.d;
      cnt.textContent=(i+1)+"/"+m.steps.length;
      fill.style.width=((i+1)/m.steps.length*100)+"%";
      box.querySelector('[data-a="prev"]').disabled=(i===0);
      box.querySelector('[data-a="next"]').disabled=(i===m.steps.length-1);
      try{nodes[i].scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"});}catch(e){}
    }
    function stop(){if(timer){clearInterval(timer);timer=null;btnPlay.textContent="▶ เล่นอัตโนมัติ";}}
    function play(){
      if(timer){stop();return;}
      btnPlay.textContent="❚❚ หยุด";
      if(cur>=m.steps.length-1)setStep(0); else if(cur<0)setStep(0);
      timer=setInterval(()=>{
        if(cur>=m.steps.length-1){stop();return;}
        setStep(cur+1);
      },2400);
    }
    box.querySelector('[data-a="prev"]').onclick=()=>{setStep(cur-1);stop();};
    box.querySelector('[data-a="next"]').onclick=()=>{setStep(cur+1);stop();};
    box.querySelector('[data-a="reset"]').onclick=()=>{stop();nodes.forEach(n=>n.classList.remove("act","done"));cur=-1;dH.textContent="รายละเอียด";dP.textContent="กดที่ขั้นใดขั้นหนึ่ง หรือกด ‘เล่นอัตโนมัติ’ เพื่อดูลำดับกลไกทั้งหมด";cnt.textContent="0/"+m.steps.length;fill.style.width="0%";box.querySelector('[data-a="prev"]').disabled=false;box.querySelector('[data-a="next"]').disabled=false;};
    btnPlay.onclick=play;
    box.querySelector('[data-a="reset"]').click();
    box._stop=stop;
    host.appendChild(box);
    return host;
  }catch(err){
    /* FALLBACK HIERARCHY: interactive → static text explanation */
    try{
      host.innerHTML="";
      const fb=h("div","model");
      let steps="";
      (m.steps||[]).forEach((s,i)=>{steps+='<div style="padding:7px 0;border-bottom:1px solid var(--border)"><b>'+esc(s.l)+'</b>'+(s.d?'<div style="font-size:.86rem;color:var(--text-2)">'+esc(s.d)+'</div>':"")+'</div>';});
      fb.innerHTML='<div class="model-head"><span class="mbadge" style="background:var(--accent)">Text Fallback</span><h4>'+esc(m.title||"ลำดับกระบวนการ")+'</h4></div>'+
        '<div style="padding:13px 15px"><div class="model-fallback">Interactive model ไม่สามารถแสดงผลในอุปกรณ์นี้ ระบบจึงแสดงคำอธิบายแบบข้อความแทน (เนื้อหาครบตามเอกสารต้นฉบับ)</div><div style="margin-top:10px">'+steps+'</div></div>';
      host.appendChild(fb);return host;
    }catch(e2){return null;}
  }
}

let INDEX=null;
function buildIndex(){
  const idx=[];
  SECTIONS.forEach(s=>{
    idx.push({id:s.id,kind:"หัวข้อบทเรียน",title:s.n+" · "+s.title,text:s.th,slide:s.slides[0]});
    idx.push({id:s.id,kind:"สรุปเนื้อหา",title:s.title,text:s.summary,slide:s.slides[0]});
    s.content.forEach(b=>{
      let t="";
      if(b.t==="ul"||b.t==="ol")t=b.x.join(" ");
      else if(b.t==="tbl")t=b.head.join(" ")+" "+b.rows.map(r=>r.join(" ")).join(" ");
      else if(b.t==="def")t=b.term+" "+b.x;
      else if(b.t==="proc")t=b.steps.map(x=>x.t+" "+(x.d||"")).join(" ");
      else t=b.x||"";
      t=String(t).replace(/<[^>]+>/g," ");
      if(t.trim())idx.push({id:s.id,kind:"เนื้อหา",title:s.title,text:t,slide:s.slides[0]});
    });
    (s.key||[]).forEach(k=>idx.push({id:s.id,kind:"จุดสำคัญ",title:s.title,text:k,slide:s.slides[0]}));
    (s.terms||[]).forEach(t=>idx.push({id:s.id,kind:"คำศัพท์",title:t.k,text:t.v,slide:s.slides[0]}));
    if(s.model)s.model.steps.forEach(st=>idx.push({id:s.id,kind:"โมเดล",title:s.model.title,text:st.l+" "+st.d,slide:s.slides[0]}));
    if(s.source)s.source.lines.forEach(l=>idx.push({id:s.id,kind:"ข้อความต้นฉบับ",title:"Slide "+l.n,text:l.txt,slide:l.n}));
  });
  REVIEW.numbers.rows.forEach(r=>idx.push({id:r[2],kind:"ตัวเลขที่ต้องจำ",title:r[0],text:r[1],slide:byId(r[2]).slides[0]}));
  REVIEW.abbr.rows.forEach(r=>idx.push({id:"review",kind:"คำย่อ",title:r[0],text:r[1]+" — "+r[2],slide:null}));
  REVIEW.keywords.rows.forEach(r=>idx.push({id:"review",kind:"คีย์เวิร์ด",title:r[0],text:r[1],slide:null}));
  REVIEW.compare.sets.forEach(c=>idx.push({id:c.sec,kind:"จุดเปรียบเทียบ",title:c.title,text:c.rows.map(r=>r.join(" ")).join(" "),slide:byId(c.sec).slides[0]}));
  SLIDES.forEach(sl=>{const s=sectionOfSlide(sl.n);idx.push({id:s?s.id:"dashboard",kind:"สไลด์",title:"Slide "+sl.n,text:sl.t,slide:sl.n});});
  INDEX=idx;
}
function doSearch(q){
  const res=document.getElementById("modalRes");res.innerHTML="";
  const query=q.trim().toLowerCase();
  if(!query){
    res.innerHTML='<div class="empty"><div class="ei"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg></div><b>ค้นหาในเอกสารเรียน</b><p>พิมพ์ชื่อโรค คำศัพท์ภาษาอังกฤษ ชื่อฮอร์โมน หรือตัวเลข เช่น “DHT”, “chocolate cyst”, “LUTS”, “30%”, “E6”</p><div class="mono" style="margin-top:12px;font-size:.72rem;color:var(--faint)">INDEX: '+(INDEX?INDEX.length:0)+' entries · เฉพาะ STUDY_SOURCE</div></div>';
    return;
  }
  if(!INDEX){res.appendChild(h("div","empty","<b>กำลังจัดทำดัชนีค้นหา…</b><p>โปรดรอสักครู่ แล้วพิมพ์คำค้นใหม่อีกครั้ง</p>"));return;}
  const hits=[];
  INDEX.forEach(e=>{
    const hay=(e.title+" "+e.text+" "+e.kind).toLowerCase();
    const p=hay.indexOf(query);
    if(p>=0){
      let score=0;
      if(e.title.toLowerCase().includes(query))score+=5;
      if(e.kind==="หัวข้อบทเรียน")score+=3;
      if(e.kind==="คำศัพท์"||e.kind==="ตัวเลขที่ต้องจำ")score+=2;
      hits.push({e,score,p});
    }
  });
  hits.sort((a,b)=>b.score-a.score);
  const top=hits.slice(0,40);
  if(!top.length){
    res.appendChild(h("div","empty",'<b>ไม่พบผลลัพธ์สำหรับ “'+esc(q)+'”</b><p>ระบบค้นหาเฉพาะเนื้อหาในเอกสารเรียน '+esc(DOC.file)+' เท่านั้น — ลองค้นด้วยคำภาษาอังกฤษ ชื่อโรค หรือตัวย่อ เช่น BPH, PID, HPV, adenomyosis</p>'));
    return;
  }
  res.appendChild(h("div","res-group","พบ "+hits.length+" รายการ · แสดง "+top.length+" รายการแรก"));
  top.forEach(({e,p})=>{
    const b=h("button","res");b.type="button";
    const s=Math.max(0,p-46);
    let ctx=(s>0?"…":"")+e.text.substr(s,150).replace(/<[^>]+>/g," ")+"…";
    const re=new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    b.innerHTML='<span class="rt"><span class="rp">'+esc(e.kind)+'</span><span></span>'+(e.slide?'<span class="rp" style="color:var(--faint)">SLIDE '+String(e.slide).padStart(3,"0")+'</span>':"")+'</span><span class="rc"></span>';
    b.querySelector(".rt span:nth-child(2)").textContent=e.title;
    b.querySelector(".rc").innerHTML=esc(ctx).replace(re,m=>"<mark>"+m+"</mark>");
    b.onclick=()=>{
      closeSearch();
      if(e.id==="review"){go("review");}
      else{openSection(e.id); if(e.slide)goSlide(e.slide,true);}
      toast("ไปยัง "+e.title);
    };
    res.appendChild(b);
  });
}

  const i=document.getElementById("modalInput");i.value=document.getElementById("searchInput").value;i.focus();

  document.getElementById("slidebar").style.display=(ST.view==="reader")?"flex":"none";
  const main=document.getElementById("main");
  main.innerHTML='<div class="wrap"><div class="sk" style="height:22px;width:180px;margin-bottom:14px"></div><div class="sk" style="height:38px;width:70%;margin-bottom:18px"></div><div class="sk" style="height:120px;margin-bottom:14px"></div><div class="sk" style="height:14px;margin-bottom:9px"></div><div class="sk" style="height:14px;width:90%;margin-bottom:9px"></div><div class="sk" style="height:14px;width:75%"></div></div>';
  requestAnimationFrame(()=>{
    try{
      if(ST.view==="dashboard")viewDashboard();
      else if(ST.view==="library")viewLibrary();
      else if(ST.view==="reader")viewReader();
      else if(ST.view==="review")viewReview();
      else if(ST.view==="bookmarks")viewBookmarks();
      else viewDashboard();
    }catch(err){
      main.innerHTML="";
      const w=h("div","wrap");
      const c=h("div","card pad");
      c.innerHTML='<div class="blk-label">Component Error Isolated</div><h3 style="margin:6px 0 8px">ส่วนแสดงผลนี้เกิดข้อผิดพลาด</h3><p style="margin:0 0 14px;color:var(--muted);font-size:.9rem">ระบบแยกความผิดพลาดไว้เฉพาะส่วนนี้ สารบัญและบทเรียนอื่นยังใช้งานได้ตามปกติ</p>';
      const b=h("button","btn pri","กลับไปหน้า Dashboard");b.onclick=()=>go("dashboard");c.appendChild(b);
      w.appendChild(c);main.appendChild(w);
    }
  });
}
let io=null;
function reveal(){
  try{
    if(io)io.disconnect();
    io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{rootMargin:"0px 0px -8% 0px"});
    document.querySelectorAll(".rv:not(.in)").forEach(e=>io.observe(e));
  }catch(e){document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));}
}

/* ---------- 18. EVENTS ---------- */
function bind(){
  document.getElementById("sideToggle").onclick=()=>{const sb=document.getElementById("sidebar");sb.classList.contains("on")?closeSidebar():openSidebar();};
  document.getElementById("scrim").onclick=()=>{closeDrawer();closeSidebar();closeSearch();};
  document.getElementById("drawerClose").onclick=closeDrawer;
  document.getElementById("bmBtn").onclick=()=>go("bookmarks");
  document.getElementById("sideFilter").oninput=renderSidebar;

  const setBtn=document.getElementById("setBtn"),pop=document.getElementById("settingsPop");
  setBtn.onclick=(e)=>{e.stopPropagation();pop.classList.toggle("on");setBtn.classList.toggle("on",pop.classList.contains("on"));};
  document.addEventListener("click",e=>{if(!pop.contains(e.target)&&e.target!==setBtn){pop.classList.remove("on");setBtn.classList.remove("on");}});
  const seg=(id,key)=>{document.querySelectorAll("#"+id+" button").forEach(b=>b.onclick=()=>{ST.set[key]=b.dataset.v;save();applySettings();});};
  seg("segTheme","theme");seg("segFs","fs");seg("segLh","lh");seg("segW","w");
  document.getElementById("tglFocus").onclick=function(){ST.set.focus=!ST.set.focus;save();applySettings();toast(ST.set.focus?"เปิด Focus Mode":"ปิด Focus Mode");};
  document.getElementById("tglAuto").onclick=function(){ST.set.auto=!ST.set.auto;save();applySettings();toast(ST.set.auto?"บันทึกความคืบหน้าอัตโนมัติ: เปิด":"บันทึกความคืบหน้าอัตโนมัติ: ปิด");};
  document.getElementById("themeBtn").onclick=()=>{
    const order=["light","sepia","dark"];const i=order.indexOf(ST.set.theme);
    ST.set.theme=order[(i+1)%order.length];save();applySettings();
    toast("ธีม: "+(ST.set.theme==="light"?"สว่าง":ST.set.theme==="sepia"?"ถนอมสายตา":"มืด"));
  };

  /* search */
  const si=document.getElementById("searchInput");
  let deb=null;
  si.addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(()=>{openSearch();},180);});
  si.addEventListener("focus",()=>openSearch());
  const mi=document.getElementById("modalInput");
  let deb2=null;
  mi.addEventListener("input",()=>{clearTimeout(deb2);deb2=setTimeout(()=>doSearch(mi.value),130);si.value=mi.value;});
  document.getElementById("modalClose").onclick=closeSearch;
  document.getElementById("searchModal").addEventListener("click",e=>{if(e.target.id==="searchModal")closeSearch();});

  /* slide nav */
  document.getElementById("slPrev").onclick=()=>goSlide(ST.slide-1);
  document.getElementById("slNext").onclick=()=>goSlide(ST.slide+1);
  document.getElementById("slRange").oninput=e=>goSlide(+e.target.value);
  const sel=document.getElementById("slSelect");
  sel.innerHTML='<option value="">Jump to slide…</option>'+SLIDES.map(s=>'<option value="'+s.n+'">'+String(s.n).padStart(3,"0")+" · "+esc(s.t.length>44?s.t.slice(0,44)+"…":s.t)+'</option>').join("");
  sel.onchange=e=>{if(e.target.value)goSlide(+e.target.value);};
  document.getElementById("slSrc").onclick=()=>{
    const s=sectionOfSlide(ST.slide);
    if(s)openSource(s.id);else openSourceAll();
  };

  /* keyboard */
  document.addEventListener("keydown",e=>{
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(e.key==="/"&&!typing){e.preventDefault();openSearch();}
    if(e.key==="Escape"){closeSearch();closeDrawer();closeSidebar();pop.classList.remove("on");setBtn.classList.remove("on");}
    if(!typing&&ST.view==="reader"){
      if(e.key==="ArrowRight"||e.key==="ArrowDown"&&e.altKey){e.preventDefault();goSlide(ST.slide+1);}
      if(e.key==="ArrowLeft"){e.preventDefault();goSlide(ST.slide-1);}
      if(e.key==="b"||e.key==="B"){toggleBm(ST.sec);if(ST.view==="reader")viewReader();}
    }
  });
}

/* ---------- 19. BOOT ---------- */
(function boot(){
  applySettings();bind();render();updateBmBadge();
  document.getElementById("slSelect").value="";
  syncSlideBar(ST.slide||1);
  const run=window.requestIdleCallback||(f=>setTimeout(f,120));
  run(()=>{try{buildIndex();}catch(e){INDEX=null;}});
})();
</script>
